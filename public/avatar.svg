<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="flame-grad" x1="20" y1="90" x2="80" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="50%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>
    <linearGradient id="inner-glow" x1="40" y1="80" x2="60" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FFF275" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Flame Silhouette -->
  <path d="M50 8 C48 20, 36 26, 32 38 C28 50, 34 60, 28 72 C22 84, 38 92, 50 92 C62 92, 78 84, 72 72 C66 60, 72 50, 68 38 C64 26, 52 20, 50 8 Z" fill="url(#flame-grad)" filter="url(#glow)"/>
  <!-- Inner Flame -->
  <path d="M50 36 C48 45, 40 50, 38 58 C36 66, 40 72, 38 80 C44 86, 56 86, 62 80 C60 72, 64 66, 62 58 C60 50, 52 45, 50 36 Z" fill="url(#inner-glow)"/>
  <!-- Spark Core -->
  <circle cx="50" cy="74" r="5" fill="#FFFFFF" opacity="0.9" />
</svg>
